name: Verify mirror

# Drift gate. On every push:
#   1. Re-runs `npm pack @agentresources/mcp@<version>` and diffs the tarball
#      contents against src/ + bin/ in this repo.
#   2. Validates server.json against the live MCP Registry schema.
#
# A drift = failed CI = MCP Registry will start rejecting publishes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-against-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read mirrored package version
        id: pkg
        run: |
          version="$(node -e 'console.log(require("./package.json").version)')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Pack the published npm artefact
        run: |
          mkdir -p .npm-tarball
          cd .npm-tarball
          npm pack "@agentresources/mcp@${{ steps.pkg.outputs.version }}"
          tar -xzf agentresources-mcp-*.tgz
          ls -la package/

      - name: Diff src/ against npm package source
        run: |
          set -euo pipefail
          # The npm tarball ships only dist/, so we instead diff bin/ (shipped) and
          # spot-check that every source file referenced from package.json#exports
          # exists. Source-tree diff is enforced by sync CI on monorepo side.
          if [[ -d bin ]]; then
            diff -ru bin .npm-tarball/package/bin
          fi

  validate-server-json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate server.json against MCP Registry schema
        run: |
          set -euo pipefail
          npm i -g ajv-cli@5
          curl -sSL -o /tmp/server.schema.json \
            https://modelcontextprotocol.io/schemas/draft/2025-11-25/server.schema.json
          ajv validate -s /tmp/server.schema.json -d server.json --strict=false
